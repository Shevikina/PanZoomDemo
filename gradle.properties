# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 2048 МБ не хватало Hilt+KSP на холодной сборке.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Кеш задач и параллельная конфигурация: модуль один, но задач много, и повторные
# прогоны :app:check после правки тестов становятся заметно короче.
org.gradle.caching=true
org.gradle.parallel=true
# Модели проекта для синка в IDE тоже собираются параллельно.
# Опция появилась в Gradle 9.4, на более старых версиях просто игнорируется.
org.gradle.tooling.parallel=true
# AGP 9 использует встроенный Kotlin и запрещает KSP добавлять исходники через kotlin.sourceSets.
# KSP нужен для Hilt-процессора; флаг возвращает прежнее поведение.
# Снять, когда Hilt перейдёт на встроенный Kotlin AGP 9: проверять при каждом обновлении Hilt.
# См. https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
